name: Release

on:
  push:
    tags:
      - 'v*'
    # A push to main whose mod_version has no release yet publishes that version (the release creates its tag).
    branches:
      - main
  # A run started by hand with a version builds that version and opens a draft release whose v<version> tag GitHub
  # creates when the draft is published. Without a version it only builds the jars.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (for example 1.8.0). Empty: build only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 21 builds the 1.21.x modules (toolchain); Java 25 runs Gradle/Loom 1.18 and
      # builds the Minecraft 26.x modules. The last listed version becomes JAVA_HOME.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mods
        working-directory: mod
        run: ./gradlew build

      # 26.2 jars are built from the same 26.x sources
      - name: Build Minecraft 26.2 mods
        working-directory: mod
        run: ./gradlew :fabric-26:build :neoforge-26:build -Pmc26_version=26.2

      - name: Get version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
          elif [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            version=$(sed -n 's/^mod_version=//p' mod/gradle.properties)
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "v$version already has a release; building only"
              echo "version=dev" >> $GITHUB_OUTPUT
              echo "release=false" >> $GITHUB_OUTPUT
            else
              echo "version=$version" >> $GITHUB_OUTPUT
              echo "release=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "version=dev" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      # The jars carry mod_version; a release must not ship jars of another version.
      - name: Check the version matches the mod and the CLI
        if: steps.version.outputs.version != 'dev'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mod=$(sed -n 's/^mod_version=//p' mod/gradle.properties)
          cli=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/pyproject.toml)
          [ "$VERSION" = "$mod" ] || { echo "version $VERSION is not mod_version $mod" >&2; exit 1; }
          [ "$VERSION" = "$cli" ] || { echo "version $VERSION is not the CLI version $cli" >&2; exit 1; }

      - name: Prepare artifact
        run: |
          mkdir -p release-files
          cp mod/fabric/build/libs/mccli-fabric-*.jar release-files/
          cp mod/fabric-1.21.4/build/libs/mccli-fabric-1.21.4-*.jar release-files/
          cp mod/neoforge/build/libs/mccli-neoforge-*.jar release-files/
          cp mod/fabric-26/build/libs/mccli-fabric-26.*.jar release-files/
          cp mod/neoforge-26/build/libs/mccli-neoforge-26.*.jar release-files/
          # Remove sources and javadoc jars if present
          rm -f release-files/*-sources.jar release-files/*-javadoc.jar
          # The Bedrock bridge's Node files, for a CLI installed with pip (MCCLI_BEDROCK_NODE points at them)
          git archive --format=tar.gz --prefix=mccli-bedrock-bridge/ -o release-files/mccli-bedrock-bridge-${{ steps.version.outputs.version }}.tar.gz HEAD bedrock

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mccli-mod
          path: release-files/*

  release:
    needs: [build-mod]
    runs-on: ubuntu-latest
    if: needs.build-mod.outputs.release == 'true'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.jar" -o -name "*.tar.gz" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Generate checksums
        working-directory: release-files
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # A push to main publishes at once; a tag or a run started by hand opens a draft.
          draft: ${{ !(github.event_name == 'push' && github.ref_type == 'branch') }}
          tag_name: v${{ needs.build-mod.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MC-CLI v${{ needs.build-mod.outputs.version }}
          body: |
            ## MC-CLI Minecraft Mod

            Download the appropriate JAR for your modloader and place it in your Minecraft mods folder.

            ### Minecraft 26.3 / 26.2 (Java 25)

            Full command set on both loaders.

            **Fabric** - `mccli-fabric-26.3-*.jar` or `mccli-fabric-26.2-*.jar`
            - Minecraft 26.3 or 26.2 (pick the matching jar)
            - Fabric Loader 0.19.5+
            - [Fabric API](https://modrinth.com/mod/fabric-api) 0.161.0+

            **NeoForge** - `mccli-neoforge-26.3-*.jar` or `mccli-neoforge-26.2-*.jar`
            - Minecraft 26.3 (NeoForge 26.3.0+) or 26.2 (NeoForge 26.2.0+)

            ### Minecraft 1.21.11 (Java 21)

            **NeoForge** - `mccli-neoforge-<version>.jar` (full command set)
            - NeoForge 21.11.0+

            **Fabric** - `mccli-fabric-<version>.jar` (core commands)
            - Fabric Loader 0.18.1+
            - [Fabric API](https://modrinth.com/mod/fabric-api)

            ### Minecraft 1.21.4 (Java 21)

            **Fabric** - `mccli-fabric-1.21.4-*.jar` (core commands)
            - Fabric Loader 0.18.4+
            - [Fabric API](https://modrinth.com/mod/fabric-api)

            ## Installation

            1. Download the JAR for your modloader below
            2. Copy to your mods folder:
               - **Linux**: `~/.minecraft/mods/`
               - **macOS**: `~/Library/Application Support/minecraft/mods/`
               - **Windows**: `%APPDATA%\.minecraft\mods\`
            3. Install the Python CLI: `pip install git+https://github.com/MrMirhan/mc-cli.git@v${{ needs.build-mod.outputs.version }}#subdirectory=cli`

            ## Bedrock Edition

            `mccli bedrock` drives the real Bedrock client on Linux (mcpelauncher) and runs the LAN bridge that takes it to a
            server, offline or signed in with Microsoft (`mccli bedrock login`). The bridge reports the client's game
            (`mccli bedrock state`, `forms`, `form-respond`). With a CLI installed by pip, unpack
            `mccli-bedrock-bridge-*.tar.gz` and set `MCCLI_BEDROCK_NODE` to its `mccli-bedrock-bridge/bedrock` folder.
            Requirements and setup: [docs/BEDROCK.md](https://github.com/MrMirhan/mc-cli/blob/main/docs/BEDROCK.md).

            ## Checksums

            See `SHA256SUMS.txt` for file integrity verification.
          files: release-files/*
